<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Widget</title>

<style>
    html, body {
        background: transparent !important;   /* force transparency */
        color: #fff;
        font-variant-caps: all-petite-caps;
        margin: 0;
        padding: 0;
    }

    .container {
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
        background: transparent !important;   /* prevent Notion override */
    }

    .widget {
        padding: 20px;
        border: 3px solid #fff;
        border-radius: 6px;
        box-shadow: 2px 2px 1px #fff;
        text-align: center;
        max-width: 95%;
        background: transparent !important;   /* prevent white fill */
    }

    .greet {
        font-size: 3em;
        margin-bottom: 10px;
    }

    .date,
    .clock {
        font-family: monospace;
        font-size: 2em;
    }

    .clock .time {
        display: inline-block;
        min-width: 24px;
    }

    .colon {
        display: inline-block;
        padding: 0 4px;
    }
</style>
</head>

<body>

<div class="container">
    <div class="widget">
        <div class="greet" id="greet"></div>
        <div class="date" id="date"></div>

        <div class="clock">
            <span class="time" id="hour"></span>
            <span class="colon">:</span>
            <span class="time" id="min"></span>
            <span class="colon">:</span>
            <span class="time" id="sec"></span>
        </div>
    </div>
</div>

<script>
    function updateGreeting(now) {
        const hrs = now.getHours();
        let greet;

        if (hrs < 12) greet = "Morning Darling";
        else if (hrs < 17) greet = "Afternoon Darling";
        else greet = "Evening Darling";

        document.getElementById("greet").textContent = greet;
    }

    function updateDate(now) {
        const days = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
        const months = ["January","February","March","April","May","June","July","August","September","October","November","December"];

        const formatted =
            `${days[now.getDay()]}, ${months[now.getMonth()]} ${now.getDate()} ${now.getFullYear()}`;

        document.getElementById("date").textContent = formatted;
    }

    function updateClock(now) {
        const hour = format12(now.getHours());
        const min = pad(now.getMinutes());
        let sec = pad(now.getSeconds());

        sec += now.getHours() >= 12 ? " pm" : " am";

        document.getElementById("hour").textContent = hour;
        document.getElementById("min").textContent = min;
        document.getElementById("sec").textContent = sec;
    }

    function format12(h) {
        if (h === 0) return 12;
        if (h > 12) return h - 12;
        return h;
    }

    function pad(n) {
        return n < 10 ? "0" + n : n;
    }

    function updateWidget() {
        const now = new Date();
        updateGreeting(now);
        updateDate(now);
        updateClock(now);
        setTimeout(updateWidget, 500);
    }

    updateWidget();
</script>

</body>
</html>
