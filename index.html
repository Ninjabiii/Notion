<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Widget</title>
<style>
    html, body {
        margin: 0;
        padding: 0;
        background: transparent;
        color: #fff;
        font-variant-caps: all-petite-caps;
    }
    body {
        visibility: hidden; /* use visibility instead of display:none */
    }
    body.ready {
        visibility: visible;
    }
    .container {
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
    }
    .widget {
        padding: 20px;
        border: 3px solid #fff;
        border-radius: 6px;
        box-shadow: 2px 2px 1px #fff;
        text-align: center;
        max-width: 95%;
        background: transparent;
    }
    .greet {
        font-size: 3em;
        margin-bottom: 10px;
    }
    .date,
    .clock {
        font-family: monospace;
        font-size: 2em;
    }
    .clock .time {
        display: inline-block;
        min-width: 24px;
    }
    .colon {
        display: inline-block;
        padding: 0 4px;
    }
</style>
</head>
<body>
<div class="container">
    <div class="widget">
        <div class="greet" id="greet"></div>
        <div class="date" id="date"></div>
        <div class="clock">
            <span class="time" id="hour"></span>
            <span class="colon">:</span>
            <span class="time" id="min"></span>
            <span class="colon">:</span>
            <span class="time" id="sec"></span>
        </div>
    </div>
</div>
<script>
    function revealWhenReady() {
        // Notion signals dark mode via a class or color-scheme on <html> or a parent frame
        // We watch for any attribute/class change on <html> and reveal shortly after
        const observer = new MutationObserver(() => {
            document.body.classList.add("ready");
            observer.disconnect();
        });

        observer.observe(document.documentElement, {
            attributes: true,
            attributeFilter: ["class", "style", "data-color-scheme"],
        });

        // Fallback: if Notion never fires a mutation (e.g. light mode, no change needed),
        // reveal after 800ms anyway
        setTimeout(() => {
            document.body.classList.add("ready");
            observer.disconnect();
        }, 800);
    }

    revealWhenReady();

    function updateGreeting(now) {
        const hrs = now.getHours();
        let greet;
        if (hrs < 12) greet = "Morning Darling";
        else if (hrs < 17) greet = "Afternoon Darling";
        else greet = "Evening Darling";
        document.getElementById("greet").textContent = greet;
    }

    function updateDate(now) {
        const days = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
        const months = ["January","February","March","April","May","June","July","August","September","October","November","December"];
        document.getElementById("date").textContent =
            `${days[now.getDay()]}, ${months[now.getMonth()]} ${now.getDate()} ${now.getFullYear()}`;
    }

    function updateClock(now) {
        document.getElementById("hour").textContent = format12(now.getHours());
        document.getElementById("min").textContent = pad(now.getMinutes());
        document.getElementById("sec").textContent = pad(now.getSeconds()) + (now.getHours() >= 12 ? " pm" : " am");
    }

    function format12(h) {
        if (h === 0) return 12;
        if (h > 12) return h - 12;
        return h;
    }

    function pad(n) { return n < 10 ? "0" + n : n; }

    function updateWidget() {
        const now = new Date();
        updateGreeting(now);
        updateDate(now);
        updateClock(now);
        setTimeout(updateWidget, 500);
    }

    updateWidget();
</script>
</body>
</html>
