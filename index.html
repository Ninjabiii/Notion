<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Greetings</title>
<style>
    html, body {
        margin: 0;
        padding: 0;
        background: #191919; /* Notion dark mode background colour */
    }
    body {
        font-variant-caps: all-petite-caps;
    }
    .container {
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 10px;
    }
    .widget {
        padding: 5px;
        color: #FFFFFF;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        max-width: 100%;
        margin: auto;
        border: 3px solid #FFFFFF;
        border-radius: 5px;
        box-shadow: 2px 2px 1px 0px #FFFFFF;
    }
    .greet {
        font-size: 3em;
    }
    .date {
        font-family: monospace;
        font-size: 2em;
    }
    .clock {
        font-family: monospace;
        font-size: 2em;
    }
    .time {
        display: inline-block;
        min-width: 20px;
    }
    .colon {
        font-size: 1em;
        display: inline-block;
    }
</style>
</head>
<body>
<div class="container">
    <div class="widget">
        <div class="greet" id="greet"></div>
        <div class="date" id="date"></div>
        <div class="clock">
            <div class="time" id="hour"></div>
            <div class="colon">:</div>
            <div class="time" id="min"></div>
            <div class="colon">:</div>
            <div class="time" id="sec"></div>
        </div>
    </div>
</div>
<script>
    function dispalyGreetings(today) {
        var hrs = today.getHours();
        var greet;
        if (hrs < 12) greet = 'Morning Darling';
        else if (hrs < 17) greet = 'Afternoon Darling';
        else greet = 'Evening Darling';
        document.getElementById('greet').innerHTML = greet;
    }

    function dispalyDate(today) {
        const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
        const monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
        document.getElementById('date').innerHTML =
            days[today.getDay()] + ', ' + monthNames[today.getMonth()] + ' ' + today.getDate() + ' ' + today.getFullYear();
    }

    function dispalyClock(today) {
        var hour = padZeros(twelveHour(today.getHours()));
        var minutes = padZeros(today.getMinutes());
        var seconds = padZeros(today.getSeconds()) + (today.getHours() >= 12 ? ' pm' : ' am');
        document.getElementById('hour').innerHTML = hour;
        document.getElementById('min').innerHTML = minutes;
        document.getElementById('sec').innerHTML = seconds;
    }

    function twelveHour(hour) {
        if (hour > 12) return hour - 12;
        if (hour === 0) return 12;
        return hour;
    }

    function padZeros(num) {
        return num < 10 ? '0' + num : num;
    }

    function dispalyWidget() {
        var today = new Date();
        dispalyGreetings(today);
        dispalyDate(today);
        dispalyClock(today);
        setTimeout(dispalyWidget, 500);
    }

    dispalyWidget();
</script>
</body>
</html>
